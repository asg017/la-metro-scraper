name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - name: check codegen'd _queries.py is fresh
        run: |
          make -B
          git diff --exit-code src/la_metro_scraper/_queries.py
